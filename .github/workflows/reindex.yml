name: mellowfellow1 / Reindex Meilisearch indexes

# Rebuilds the Meilisearch indexes from WooGraphQL by running the reindex CLI on
# the runner, one job per index.
#
# The work used to run inside POST /api/reindex on Atlas. The platform cuts every
# API request off at exactly 30s, which is fixed and has no background job support,
# and the products crawl sits at roughly 23s with several seconds of night to night
# swing, so it failed whenever WordPress was slow. The runner has no such ceiling.
#
# /api/reindex still exists and is unchanged: it is what the WordPress publish hook
# calls for a single index.

on:
  workflow_dispatch:

  # Full-catalog reindex, daily by design: rebuildIndex has no concurrency lock,
  # so runs must not overlap. A save-triggered webhook with a delta mode is the
  # intended follow-up.
  schedule:
    - cron: '0 9 * * *'

concurrency:
  group: meilisearch-reindex
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reindex:
    name: Rebuild ${{ matrix.index }} index
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      # Every index is attempted even if an earlier one fails, so a products
      # failure cannot hide a collections problem. Any failure still fails the run.
      fail-fast: false

      # Sequential on purpose: parallel requests would double the load on
      # WordPress inside the same window.
      max-parallel: 1

      # Adding an index is one entry here plus one definition in src/lib/reindex.ts.
      matrix:
        index: [products, collections, posts]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reindex ${{ matrix.index }}
        env:
          # Stored as repository variables, not secrets, on purpose. The CLI prints
          # both hosts before it writes anything so a wrong pairing is visible in
          # the log, and GitHub masks secrets, which would print them as *** and
          # defeat that check. Neither value is usable without the key below.
          NEXT_PUBLIC_WORDPRESS_URL: ${{ vars.NEXT_PUBLIC_WORDPRESS_URL }}
          MEILISEARCH_HOST: ${{ vars.MEILISEARCH_HOST }}

          MEILISEARCH_ADMIN_KEY: ${{ secrets.MEILISEARCH_ADMIN_KEY }}

          # Read through the environment, never interpolated into the run script,
          # so a matrix value can never be parsed as shell.
          INDEX_TYPE: ${{ matrix.index }}

        # --allow-remote is required because the target is not a local Meilisearch.
        # It is spelled out here rather than defaulted so the intent is at the call
        # site. Exit 2 means the job is misconfigured, exit 1 means the rebuild
        # itself failed and is worth retrying.
        run: npm run search:reindex -- --index="${INDEX_TYPE}" --allow-remote

  notify:
    needs: reindex
    if: failure()
    permissions:
      actions: read
    uses: ./.github/workflows/notify-failure.yml
    secrets: inherit
