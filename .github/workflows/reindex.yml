name: mellowfellow1 / Reindex Meilisearch indexes

# Rebuilds the Meilisearch indexes from WooGraphQL by calling
# POST /api/reindex?type=<index> on the Atlas frontend, one request per index.
#
# One request per index is deliberate. The platform cuts a request off at roughly
# 30s, and a single untyped call rebuilt every index in one request: products
# (27.6s) plus collections (7.3s) went over the ceiling and failed. Each index on
# its own stays well under it.

on:
  workflow_dispatch:

  # Full-catalog reindex, daily by design: /api/reindex has no concurrency lock,
  # so runs must not overlap. A save-triggered webhook with a delta mode is the
  # intended follow-up.
  schedule:
    - cron: '0 9 * * *'

concurrency:
  group: meilisearch-reindex
  cancel-in-progress: false

permissions: {}

jobs:
  reindex:
    name: Rebuild ${{ matrix.index }} index
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      # Every index is attempted even if an earlier one fails, so a products
      # failure cannot hide a collections problem. Any failure still fails the run.
      fail-fast: false

      # Sequential on purpose: parallel requests would double the load on
      # WordPress inside the same window the 30s ceiling applies to.
      max-parallel: 1

      # Adding an index is one entry here, once /api/reindex accepts the type.
      matrix:
        index: [products, collections, posts]

    steps:
      - name: Reindex ${{ matrix.index }}
        env:
          # Must NOT have a trailing slash — this workflow appends "/api/reindex",
          # and a trailing slash produces "//api/reindex", which 404s.
          ATLAS_URL: ${{ vars.ATLAS_URL }}

          # Must be stored with NO trailing newline — the endpoint length-checks
          # before timingSafeEqual(), so a stray "\n" is rejected as 401.
          REINDEX_SECRET: ${{ secrets.REINDEX_SECRET }}

          # Read through the environment, never interpolated into the script
          # below, so a matrix value can never be parsed as shell.
          INDEX_TYPE: ${{ matrix.index }}
        run: |
          # errexit is disabled on purpose. GitHub runs this step as `bash -e`,
          # and `set -uo pipefail` does not turn that off, so the script used to
          # abort at the HTTP_CODE assignment the instant curl reported failure:
          # CURL_EXIT, the ::error:: line and the response body never ran, which
          # made every failure unreadable from the log. Each check below is
          # explicit instead.
          set +e
          set -uo pipefail

          if [ -z "${ATLAS_URL}" ]; then
            echo "::error::ATLAS_URL repository variable is not set."
            exit 1
          fi

          if [ -z "${REINDEX_SECRET}" ]; then
            echo "::error::REINDEX_SECRET repository secret is not set."
            exit 1
          fi

          echo "POST ${ATLAS_URL}/api/reindex?type=${INDEX_TYPE}"

          HTTP_CODE=$(curl -sS --fail-with-body --max-time 300 \
            -X POST "${ATLAS_URL}/api/reindex?type=${INDEX_TYPE}" \
            -H "x-reindex-secret: ${REINDEX_SECRET}" \
            -A "Mellow-Fellow-Reindex/1.0 (+github-actions)" \
            -o response.json \
            -w '%{http_code}')
          CURL_EXIT=$?

          HTTP_CODE="${HTTP_CODE:-000}"
          BODY="$(cat response.json 2>/dev/null || true)"

          if [ "${CURL_EXIT}" -ne 0 ] || [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::error::Reindex of ${INDEX_TYPE} failed — HTTP ${HTTP_CODE} (curl exit ${CURL_EXIT})."
            echo "Response: ${BODY}"

            {
              echo "### Meilisearch reindex: ${INDEX_TYPE}"
              echo ""
              echo "Failed with HTTP ${HTTP_CODE} (curl exit ${CURL_EXIT})."
              echo ""
              echo '```json'
              echo "${BODY:-(empty response body)}"
              echo '```'
              echo ""
            } >> "${GITHUB_STEP_SUMMARY}"

            exit 1
          fi

          INDEXED=$(printf '%s' "${BODY}" | jq -r '.indexed // "unknown"' 2>/dev/null)
          DELETED=$(printf '%s' "${BODY}" | jq -r '.deleted // "unknown"' 2>/dev/null)
          DURATION=$(printf '%s' "${BODY}" | jq -r '.durationMs // "unknown"' 2>/dev/null)

          INDEXED="${INDEXED:-unknown}"
          DELETED="${DELETED:-unknown}"
          DURATION="${DURATION:-unknown}"

          echo "Reindex of ${INDEX_TYPE} succeeded (HTTP ${HTTP_CODE})."
          echo "  indexed: ${INDEXED}"
          echo "  deleted: ${DELETED}"
          echo "  durationMs: ${DURATION}"

          {
            echo "### Meilisearch reindex: ${INDEX_TYPE}"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Indexed | ${INDEXED} |"
            echo "| Deleted | ${DELETED} |"
            echo "| Duration (ms) | ${DURATION} |"
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
